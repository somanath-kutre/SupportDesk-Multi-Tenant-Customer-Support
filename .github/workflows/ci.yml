name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: supportdesk
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_ENGINE: mysql
      DB_NAME: supportdesk
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      # Remove this step once you commit your migrations (recommended).
      - name: Generate migrations if not committed
        run: python manage.py makemigrations accounts tickets --noinput

      - name: Run tests with coverage
        run: pytest --cov=apps --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t supportdesk:ci .
